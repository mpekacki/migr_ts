name: Version bump

# Merging a pull request is a push to main, and that is the event to bump on: a
# `pull_request` run for a pull request raised from a *fork* is untrusted, so it
# gets no secrets and a read-only token - the push below would fail with a 403,
# and merging an outside contribution would silently skip its release. A push
# made with GITHUB_TOKEN (the bump commit and its tag) starts no workflow run of
# its own, so this does not re-trigger itself.
on:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: version-bump

jobs:
  bump:
    # Belt and braces against a release loop, should the push above ever be made
    # with a token that does trigger workflows.
    if: "!startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout main
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Most merges here add something, so minor is the default and a `patch` label
    # is what steps it down. `major` wins over both. The labels belong to the pull
    # request this commit arrived through, which the push event does not carry; a
    # commit pushed straight to main has none and takes the default.
    - name: Determine bump level
      id: level
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        LABELS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
          --jq '.[].labels[].name' | tr '\n' ' ')
        echo "labels: $LABELS"
        level=minor
        [[ " $LABELS " == *" patch "* ]] && level=patch
        [[ " $LABELS " == *" major "* ]] && level=major
        echo "level=$level" >> "$GITHUB_OUTPUT"

    - name: Bump version and push
      id: bump
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        npm version ${{ steps.level.outputs.level }} -m "chore: release v%s"
        git push --follow-tags
        echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Create production build
      run: npm run release

    # Release assets never expire, unlike the workflow artifacts this replaced.
    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.bump.outputs.version }}
      run: |
        gh release create "v$VERSION" \
          "build/v$VERSION/bundle.js" \
          --title "v$VERSION" \
          --generate-notes \
          --verify-tag
