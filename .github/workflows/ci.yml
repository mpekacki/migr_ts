name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DEVHUB_ALIAS: devhub
  TEST_ORG_A_ALIAS: testMigrationOrgA
  TEST_ORG_B_ALIAS: testMigrationOrgB
  SCRATCH_ORG_DURATION: 30

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Salesforce CLI
      run: |
        npm install -g @salesforce/cli
        sf --version

    - name: Authenticate to DevHub
      env:
        DEVHUB_AUTH_URL: ${{ secrets.DEVHUB_AUTH_URL }}
      run: |
        echo "$DEVHUB_AUTH_URL" > devhub_auth.txt
        sf org login sfdx-url \
          --sfdx-url-file devhub_auth.txt \
          --alias "$DEVHUB_ALIAS"
        rm devhub_auth.txt

    - name: Check and manage scratch orgs
      run: |
        # Function to check if org exists and is active
        check_org_status() {
          local org_alias=$1
          sf org list --json | jq -r ".result.scratchOrgs[]? | select(.alias == \"$org_alias\") | .status"
        }

        # Function to create or recreate scratch org
        create_scratch_org() {
          local org_alias=$1
          echo "Creating scratch org: $org_alias"
          
          # Delete existing org if it exists (even if expired)
          if sf org list --json | jq -e ".result.scratchOrgs[]? | select(.alias == \"$org_alias\")" > /dev/null; then
            echo "Deleting existing scratch org: $org_alias"
            sf org delete scratch --alias "$org_alias" --no-prompt || true
          fi
          
          # Create new scratch org
          sf org create scratch \
            --definition-file tests/TestProject/config/project-scratch-def.json \
            --alias "$org_alias" \
            --target-dev-hub "$DEVHUB_ALIAS" \
            --duration-days "$SCRATCH_ORG_DURATION" \
            --wait 10
          
          # Deploy test project to scratch org
          cd tests/TestProject
          sf project deploy start --target-org "$org_alias"
          cd ../..
        }

        # Check and manage Test Org A
        org_a_status=$(check_org_status "$TEST_ORG_A_ALIAS")
        if [ "$org_a_status" != "Active" ]; then
          echo "Test Org A status: $org_a_status (needs recreation)"
          create_scratch_org "$TEST_ORG_A_ALIAS"
        else
          echo "Test Org A is active"
        fi

        # Check and manage Test Org B  
        org_b_status=$(check_org_status "$TEST_ORG_B_ALIAS")
        if [ "$org_b_status" != "Active" ]; then
          echo "Test Org B status: $org_b_status (needs recreation)"
          create_scratch_org "$TEST_ORG_B_ALIAS"
        else
          echo "Test Org B is active"
        fi

        # Create test data in Org A
        echo "Setting up test data in Org A"
        sf data create record \
          --target-org "$TEST_ORG_A_ALIAS" \
          --sobject Custom_Setting_1__c \
          --values "Is_Org_A__c=true"

    - name: Run linter
      run: npm run lint || true

    - name: Run build
      run: npm run build

    - name: Run tests
      run: npm test

    - name: Cleanup scratch orgs (on failure)
      if: failure()
      run: |
        sf org delete scratch --alias "$TEST_ORG_A_ALIAS" --no-prompt || true
        sf org delete scratch --alias "$TEST_ORG_B_ALIAS" --no-prompt || true

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Create production build
      run: npm run release

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: build/
        retention-days: 30