name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DEVHUB_ALIAS: devhub
  TEST_ORG_A_ALIAS: testMigrationOrgA
  TEST_ORG_B_ALIAS: testMigrationOrgB
  SCRATCH_ORG_DURATION: 30

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Salesforce CLI
      run: |
        npm install -g @salesforce/cli
        sf --version

    - name: Cache Salesforce CLI data
      uses: actions/cache@v4
      with:
        path: |
          ~/.sf
          ~/.sfdx
          ./scratch-orgs.json
        key: sf-data-${{ runner.os }}-${{ github.repository }}
        restore-keys: |
          sf-data-${{ runner.os }}-${{ github.repository }}
          sf-data-${{ runner.os }}-

    - name: Authenticate to DevHub
      env:
        DEVHUB_AUTH_URL: ${{ secrets.DEVHUB_AUTH_URL }}
      run: |
        echo "$DEVHUB_AUTH_URL" > devhub_auth.txt
        sf org login sfdx-url \
          --sfdx-url-file devhub_auth.txt \
          --alias "$DEVHUB_ALIAS"
        rm devhub_auth.txt

    - name: Check and manage scratch orgs
      run: |
        # Debug: Show cache status
        echo "=== Cache Debug Info ==="
        echo "Working directory: $(pwd)"
        echo "Files in current directory:"
        ls -la
        
        # Initialize scratch org cache file if it doesn't exist
        if [ ! -f scratch-orgs.json ]; then
          echo "Creating new scratch-orgs.json cache file"
          echo '{}' > scratch-orgs.json
        else
          echo "Found existing scratch-orgs.json:"
          cat scratch-orgs.json
        fi
        echo "========================"

        # Function to check if cached org is still valid
        is_org_valid() {
          local org_alias=$1
          local org_info=$(jq -r ".$org_alias // empty" scratch-orgs.json)
          
          if [ -z "$org_info" ] || [ "$org_info" = "null" ]; then
            echo "false"
            return
          fi
          
          local created_date=$(echo "$org_info" | jq -r '.createdDate // empty')
          local org_id=$(echo "$org_info" | jq -r '.orgId // empty')
          
          if [ -z "$created_date" ] || [ -z "$org_id" ]; then
            echo "false"
            return
          fi
          
          # Check if org is less than 28 days old (2 day buffer before 30-day expiry)
          local created_timestamp=$(date -d "$created_date" +%s 2>/dev/null || echo "0")
          local current_timestamp=$(date +%s)
          local days_old=$(( (current_timestamp - created_timestamp) / 86400 ))
          
          if [ $days_old -lt 28 ]; then
            echo "true"
          else
            echo "false"
          fi
        }

        # Function to save org info to cache
        save_org_info() {
          local org_alias=$1
          local org_list_output=$(sf org list --json)
          local org_info=$(echo "$org_list_output" | jq -r ".result.scratchOrgs[]? | select(.alias == \"$org_alias\")")
          
          if [ -n "$org_info" ]; then
            local org_id=$(echo "$org_info" | jq -r '.orgId')
            local created_date=$(echo "$org_info" | jq -r '.createdDate')
            
            # Update cache with org info
            jq ".$org_alias = {\"orgId\": \"$org_id\", \"createdDate\": \"$created_date\", \"alias\": \"$org_alias\"}" scratch-orgs.json > temp.json
            mv temp.json scratch-orgs.json
            echo "Cached info for $org_alias (ID: $org_id, Created: $created_date)"
          fi
        }

        # Function to create or recreate scratch org
        create_scratch_org() {
          local org_alias=$1
          echo "Creating scratch org: $org_alias"
          
          # Delete existing org if it exists (even if expired)
          if sf org list --json | jq -e ".result.scratchOrgs[]? | select(.alias == \"$org_alias\")" > /dev/null; then
            echo "Deleting existing scratch org: $org_alias"
            sf org delete scratch --alias "$org_alias" --no-prompt || true
          fi
          
          # Create new scratch org
          sf org create scratch \
            --definition-file tests/TestProject/config/project-scratch-def.json \
            --alias "$org_alias" \
            --target-dev-hub "$DEVHUB_ALIAS" \
            --duration-days "$SCRATCH_ORG_DURATION" \
            --wait 10
          
          # Save org info to cache
          save_org_info "$org_alias"
          
          # Deploy test project to scratch org
          cd tests/TestProject
          sf project deploy start --target-org "$org_alias"
          cd ../..
          
          # Create test data if this is Org A
          if [ "$org_alias" = "$TEST_ORG_A_ALIAS" ]; then
            echo "Setting up test data in new Org A"
            sf data create record \
              --target-org "$TEST_ORG_A_ALIAS" \
              --sobject Custom_Setting_1__c \
              --values "Is_Org_A__c=true"
          fi
        }

        # Check and manage Test Org A
        if [ "$(is_org_valid "$TEST_ORG_A_ALIAS")" = "true" ]; then
          echo "Test Org A is cached and should be valid"
          # Try to verify it's actually accessible by testing connection
          if sf org display --target-org "$TEST_ORG_A_ALIAS" --json > /dev/null 2>&1; then
            echo "Test Org A confirmed active and accessible"
          else
            echo "Test Org A not accessible, recreating"
            create_scratch_org "$TEST_ORG_A_ALIAS"
          fi
        else
          echo "Test Org A not cached or expired, creating new org"
          create_scratch_org "$TEST_ORG_A_ALIAS"
        fi

        # Check and manage Test Org B
        if [ "$(is_org_valid "$TEST_ORG_B_ALIAS")" = "true" ]; then
          echo "Test Org B is cached and should be valid"
          # Try to verify it's actually accessible by testing connection
          if sf org display --target-org "$TEST_ORG_B_ALIAS" --json > /dev/null 2>&1; then
            echo "Test Org B confirmed active and accessible"
          else
            echo "Test Org B not accessible, recreating"
            create_scratch_org "$TEST_ORG_B_ALIAS"
          fi
        else
          echo "Test Org B not cached or expired, creating new org"
          create_scratch_org "$TEST_ORG_B_ALIAS"
        fi

        echo "Current scratch org cache:"
        cat scratch-orgs.json

    - name: Run linter
      run: npm run lint || true

    - name: Run build
      run: npm run build

    - name: Run tests
      run: |
        echo "::group::Running Jest Tests"
        npm run test:ci
        echo "::endgroup::"

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Create production build
      run: npm run release

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: build/
        retention-days: 30