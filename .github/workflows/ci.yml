name: CI

on:
  pull_request:
    branches: [ main ]

env:
  DEVHUB_ALIAS: devhub
  TEST_ORG_A_ALIAS: testMigrationOrgA
  TEST_ORG_B_ALIAS: testMigrationOrgB
  SCRATCH_ORG_DURATION: 30
  # A pull request from a fork is untrusted code, so GitHub passes it no secrets:
  # DEVHUB_AUTH_URL arrives empty and there is no Dev Hub to raise scratch orgs
  # in. Every org-dependent step is skipped for those runs and the suites that
  # need an org are dropped from the test run, so a contributor still gets the
  # lint, the build and everything that runs without an org. Never move this
  # workflow to pull_request_target to "fix" that - it would run the fork's code
  # with full access to the secrets below.
  HAS_ORGS: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Salesforce CLI
      if: env.HAS_ORGS == 'true'
      run: |
        npm install -g @salesforce/cli
        sf --version

    # ~/.sf and ~/.sfdx are not a build cache, they are the CLI's credential
    # store - the Dev Hub auth file lands there, next to the key that decrypts it
    # on a headless runner. They were cached here once; nothing in them is worth
    # keeping (each run raises its own scratch orgs), and a cache scoped to the
    # default branch is readable by a pull request from a fork.

    - name: Authenticate to DevHub
      if: env.HAS_ORGS == 'true'
      env:
        DEVHUB_AUTH_URL: ${{ secrets.DEVHUB_AUTH_URL }}
      run: |
        echo "$DEVHUB_AUTH_URL" > devhub_auth.txt
        sf org login sfdx-url \
          --sfdx-url-file devhub_auth.txt \
          --alias "$DEVHUB_ALIAS"
        rm devhub_auth.txt

    - name: Create scratch orgs
      if: env.HAS_ORGS == 'true'
      run: |
        echo "Creating fresh scratch orgs for testing..."
        
        # Function to create scratch org
        create_scratch_org() {
          local org_alias=$1
          echo "Creating scratch org: $org_alias"
          
          # Delete existing org if it exists
          if sf org list --json | jq -e ".result.scratchOrgs[]? | select(.alias == \"$org_alias\")" > /dev/null; then
            echo "Deleting existing scratch org: $org_alias"
            sf org delete scratch --target-org "$org_alias" --no-prompt || true
          fi
          
          # Create new scratch org
          sf org create scratch \
            --definition-file tests/TestProject/config/project-scratch-def.json \
            --alias "$org_alias" \
            --target-dev-hub "$DEVHUB_ALIAS" \
            --duration-days "$SCRATCH_ORG_DURATION" \
            --wait 10
          
          # Deploy test project to scratch org
          cd tests/TestProject
          sf project deploy start --target-org "$org_alias"
          cd ../..
          
          # Create test data if this is Org A
          if [ "$org_alias" = "$TEST_ORG_A_ALIAS" ]; then
            echo "Setting up test data in Org A"
            sf data create record \
              --target-org "$TEST_ORG_A_ALIAS" \
              --sobject Custom_Setting_1__c \
              --values "Is_Org_A__c=true"

            # Assign Enhanced E Permission Set
            sf org assign permset \
              --target-org "$TEST_ORG_A_ALIAS" \
              --name "Enhanced_E"
          fi
        }

        # Create both test orgs
        create_scratch_org "$TEST_ORG_A_ALIAS"
        create_scratch_org "$TEST_ORG_B_ALIAS"
        
        echo "Scratch orgs created successfully"

    - name: Run linter
      run: npm run lint

    - name: Run build
      run: npm run build

    - name: Run tests
      if: env.HAS_ORGS == 'true'
      run: |
        echo "Starting test execution..."
        npm run test:ci
        echo "All tests completed"

    - name: Run tests (no scratch orgs)
      if: env.HAS_ORGS != 'true'
      env:
        MIGR_TS_TEST_NO_ORGS: '1'
      run: |
        echo "Starting test execution without scratch orgs..."
        npm run test:ci
        echo "All tests completed"

    - name: Cleanup scratch orgs
      if: always() && env.HAS_ORGS == 'true'
      run: |
        echo "Cleaning up scratch orgs..."
        
        # Clean up Test Org A
        if sf org list --json | jq -e ".result.scratchOrgs[]? | select(.alias == \"$TEST_ORG_A_ALIAS\")" > /dev/null; then
          echo "Deleting Test Org A: $TEST_ORG_A_ALIAS"
          sf org delete scratch --target-org "$TEST_ORG_A_ALIAS" --no-prompt || true
        else
          echo "Test Org A not found, skipping cleanup"
        fi
        
        # Clean up Test Org B  
        if sf org list --json | jq -e ".result.scratchOrgs[]? | select(.alias == \"$TEST_ORG_B_ALIAS\")" > /dev/null; then
          echo "Deleting Test Org B: $TEST_ORG_B_ALIAS"
          sf org delete scratch --target-org "$TEST_ORG_B_ALIAS" --no-prompt || true
        else
          echo "Test Org B not found, skipping cleanup"
        fi
        
        echo "Cleanup completed"